<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#121110;--panel:#26241f;--panel2:#2f2c26;--line:#433f36;--beige:#d8ccb2;--beige2:#a89d86;--sand:#efe6d2;
--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--beige);font:15px/1.5 var(--sans);display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--beige);outline-offset:2px}
header.top{flex-wrap:wrap;display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--ink)}
.brand{font:600 24px var(--serif);color:var(--sand);letter-spacing:.01em;margin-right:auto}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 12px;color:var(--beige)}
.btn:hover{border-color:var(--beige2)}
.btn.pri{background:var(--beige);color:var(--ink);border-color:var(--beige);font-weight:600}
.btn.pri:hover{background:var(--sand)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.danger:hover{border-color:#c4806a;color:#e0a794}
#menu{display:none}
main{flex:1;display:flex;min-height:0}
aside{width:340px;max-width:44%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-h{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.search{padding:8px 16px;border-bottom:1px solid var(--line)}
.search input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:7px 10px;color:var(--beige)}
.row .lab.hit{box-shadow:inset 0 -2px var(--beige2)}
#tree{overflow-y:auto;overflow-x:hidden;min-height:0;padding:8px 6px 24px;flex:1}
.row{display:flex;align-items:flex-start;gap:2px;border-radius:3px;padding:2px 4px}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--beige);color:var(--ink)}
.row .car{width:20px;height:22px;border:0;background:none;color:inherit;opacity:.8;flex:none;padding:0}
.row .car.leaf{visibility:hidden}
.row .lab{flex:1;min-width:0;text-align:left;background:none;border:0;padding:3px 4px;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
.lv0>.row .lab{font:400 16px var(--serif)}
.lv3>.row .lab{font-family:var(--serif);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.row .plus,.row .pen{width:24px;height:22px;flex:none;border:1px solid var(--line);border-radius:3px;background:none;padding:0;line-height:1;opacity:.55;margin-left:2px}
.row .plus:hover,.row .plus:focus-visible,.row .pen:hover,.row .pen:focus-visible{opacity:1;border-color:var(--beige2)}
.row.sel .plus,.row.sel .pen{border-color:var(--ink)}
.grid label{position:relative}
.cb{position:absolute;top:100%;left:0;right:0;margin-top:2px;max-height:168px;overflow-y:auto;background:var(--ink);border:1px solid var(--beige2);border-radius:3px;z-index:6}
.cb.up{top:auto;bottom:100%;margin:0 0 2px}
.cb .opt{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px;color:var(--beige)}
.cb .opt:hover{background:var(--panel2)}
.pick{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:3px;background:var(--ink);margin-top:10px}
.pick .opt{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;color:var(--beige);overflow-wrap:anywhere}
.pick .opt:hover{background:var(--panel2)}
.pick .opt.on{background:var(--beige);color:var(--ink)}
.cb .none{padding:8px 10px;color:var(--beige2);font-size:13px}
.ctext{margin-top:14px;padding:10px 12px;background:var(--ink);border:1px solid var(--line);border-radius:3px;font:15px/1.5 var(--serif);color:var(--sand);overflow-wrap:anywhere}
.lv1>.row .lab,.lv2>.row .lab{font-family:var(--serif)}
.kids{margin-left:13px;border-left:1px solid var(--line);padding-left:3px}
.empty{color:var(--beige2);padding:16px}
section.view{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
section.view>*{flex:none}
.when{padding:18px 28px 0}
.when h3{margin:0 0 10px;font:600 18px var(--serif);color:var(--sand)}
.when textarea{width:100%;min-height:96px;resize:vertical;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;color:var(--beige);font:16px/1.55 var(--serif)}
.when textarea::placeholder{color:var(--beige2)}
.when-h{display:flex;align-items:center;margin-bottom:10px}
.when .when-h h3{margin:0 auto 0 0}
.when-txt{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font:16px/1.55 var(--serif);overflow-wrap:anywhere}
.chain{padding:22px 28px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.chain h2{margin:0 0 12px;font:400 15px var(--sans);color:var(--beige2)}
.crumbs{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 10px}
.crumb{display:flex;flex-direction:column}
.crumb small{color:var(--beige2);font-size:11.5px;margin-bottom:1px}
.crumb span{font:400 22px/1.2 var(--serif);color:var(--sand)}
.sep{font:400 22px var(--serif);color:var(--beige2);padding-bottom:0}
.chain-act{margin-top:14px;display:flex;gap:8px}
.notes{display:flex;flex-direction:column;padding:18px 28px 28px}
.notes-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.notes-h h3{margin:0 auto 0 0;font:600 18px var(--serif);color:var(--sand)}
#list{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.note{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:16px;line-height:1.55}
.note:last-child{border:0}
.note .body{flex:1;min-width:0;overflow-wrap:anywhere}
.note ul,.note ol,#ed ul,#ed ol{margin:.3em 0;padding-left:1.4em}
.note a,#ed a{color:var(--sand);text-decoration:underline}
.note .x{align-self:flex-start}
.composer{margin-top:12px;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.tools{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-bottom:1px solid var(--line);align-items:center}
.tools button{min-width:34px;height:30px;background:none;border:1px solid transparent;border-radius:3px;color:var(--beige)}
.tools button:hover{border-color:var(--beige2);background:var(--panel2)}
.tools input{background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:4px 8px;width:190px}
#ed{min-height:64px;max-height:160px;overflow:auto;padding:10px 12px;font:16px/1.55 var(--serif);outline:0}
#ed:empty::before{content:attr(data-ph);color:var(--beige2)}
.composer .foot{display:flex;justify-content:flex-end;padding:6px}
.ph{color:var(--beige2);padding:40px 28px;font:italic 18px var(--serif)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--panel);border:1px solid var(--beige2);border-radius:4px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 12px;font:600 20px var(--serif);color:var(--sand)}
.modal p{margin:0 0 10px;color:var(--beige2);font-size:14px}
.modal textarea{width:100%;height:240px;background:var(--ink);border:1px solid var(--line);border-radius:3px;color:var(--beige);padding:10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.modal .acts{flex-wrap:wrap;display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--beige2)}
.grid .full{grid-column:1/-1}
.grid input,.grid select{background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:7px 9px;color:var(--beige);font-size:15px}
.grid .pair{display:flex;gap:8px}.grid .pair>*{flex:1}
.msg{color:#e0a794;font-size:13px;margin-top:8px;min-height:1em}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--beige);color:var(--ink);padding:8px 16px;border-radius:3px;z-index:20;font-weight:500}
#graph{display:none;flex:1;min-width:0;flex-direction:column;min-height:0}
body.tree-mode aside,body.tree-mode section.view{display:none}
body.tree-mode #graph{display:flex}
body.tree-mode #menu{display:none!important}
.gz{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--beige2)}
.gz input{width:120px;accent-color:var(--beige)}
.gbar{flex-wrap:wrap;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.gbar input{width:240px;max-width:40%;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:6px 10px;color:var(--beige)}
.gsel{flex:1;min-width:0;font:14px var(--serif);color:var(--sand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gscroll{flex:1;overflow:auto;min-height:0;background:var(--ink)}
.gcanvas{position:relative}
.ghead{position:sticky;top:0;z-index:3;height:38px;background:var(--panel);border-bottom:1px solid var(--line)}
.ghead div{position:absolute;top:0;height:38px;display:flex;align-items:center;justify-content:center;font:600 14px var(--serif);color:var(--sand);border-left:1px solid var(--line)}
.gcol{position:absolute;top:38px;bottom:0;border-left:1px solid var(--line);background:rgba(255,255,255,.015)}
.glines{position:absolute;left:0;top:0;pointer-events:none}
.gn{position:absolute;box-sizing:border-box;padding:3px 10px;display:flex;align-items:center;justify-content:center;text-align:center;font:13px/1.25 var(--sans);background:var(--panel2);border:1px solid var(--beige2);border-radius:3px;color:var(--beige);cursor:pointer;overflow:hidden}
.gn span{display:-webkit-box;-webkit-line-clamp:var(--lines,2);-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.gn.l3{font:700 13px/1.25 var(--serif);color:var(--sand);background:var(--panel);border-color:var(--beige)}
.gn.l7{background:var(--beige2);color:var(--ink);border-color:var(--beige2);font-weight:600}
.gn.hit{box-shadow:0 2px 0 var(--sand)}
.gn.sel{background:var(--beige);color:var(--ink);border-color:var(--sand);outline:2px solid var(--sand);outline-offset:2px}
@media(max-width:760px){
 #menu{display:inline-block}
 aside{position:fixed;inset:var(--hh,54px) 0 0 0;width:auto;max-width:none;z-index:5;transform:translateX(-100%);transition:transform .2s}
 aside.open{transform:none}
 .chain,.notes,.when{padding-left:16px;padding-right:16px}
 .crumb span{font-size:19px}
 .grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<header class="top">
 <button class="btn" id="menu">Tree</button>
 <div class="brand">Inventory</div>
 <button class="btn" id="mode">Tree mode</button>
 <button class="btn" id="hLoad">Load hierarchy</button>
 <button class="btn" id="hSave">Save hierarchy</button>
 <button class="btn" id="aLoad">Load all</button>
 <button class="btn pri" id="aSave">Save all</button>
</header>
<main>
 <aside id="side">
  <div class="side-h">
   <button class="btn pri sm" id="add">Add header</button>
   <button class="btn sm" id="expand">Expand all</button>
   <button class="btn sm" id="collapse">Collapse all</button>
   <button class="btn sm" id="sort" title="Change sort order">A–Z</button>
  </div>
  <div class="search"><input id="q" type="search" placeholder="Search the hierarchy" aria-label="Search the hierarchy" autocomplete="off"></div>
  <div id="tree"></div>
 </aside>
 <section class="view" id="view"></section>
 <section id="graph">
  <div class="gbar">
   <input id="gq" type="search" placeholder="Search the tree" aria-label="Search the tree" autocomplete="off">
   <button class="btn sm" id="gsort" title="Change sort order">A–Z</button>
   <label class="gz" title="Squeeze the tree to see more of it">Shrink <input type="range" id="gz" min="0" max="100" value="0" aria-label="Shrink the tree"></label>
   <button class="btn sm" id="gfit" title="Shrink just enough to fit the whole tree on screen">Fit all</button>
   <div class="gsel" id="gsel"></div>
   <button class="btn pri sm" id="gopen" hidden>Open in editor</button>
  </div>
  <div class="gscroll" id="gs"></div>
 </section>
</main>
<script>
const LEVELS=['Scheme','Category','Enquiry','Header','Subject','Topic (Noun)','Action (Verb)','Enquiry / Request'];
const SUBJECTS=['SC','PR','Foreigner','Foreigner (Malaysian)','Foreigner (Non-Malaysian)','Anonymous'];
const KEY='inventory.v1';
let data={headers:[],notes:{},when:{},stubs:[]};
let sel=null, open=new Set(), sortDir=1, mode='list';
const FIELDS=['scheme','category','enquiry','header','subject','topic','action'];

const SEED={headers:[
 {scheme:'Housing',category:'Repairs',enquiry:'Maintenance',header:'Broken heater',subject:'SC',topic:'Heater',action:'Repair',count:1,type:'enq'},
 {scheme:'Housing',category:'Repairs',enquiry:'Maintenance',header:'Broken heater',subject:'SC',topic:'Heater',action:'Repair',count:2,type:'req'},
 {scheme:'Housing',category:'Repairs',enquiry:'Maintenance',header:'Broken heater',subject:'PR',topic:'Heater',action:'Replace',count:1,type:'req'},
 {scheme:'Housing',category:'Applications',enquiry:'Status',header:'Pending form',subject:'Foreigner',topic:'Form',action:'Submit',count:3,type:'enq'}
],notes:{}};

const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const cLabel=h=>`${ord(h.count)} ${h.type==='enq'?'enquiry':'request'}`;
const pathOf=h=>[h.scheme,h.category,h.enquiry,h.header,h.subject,h.topic,h.action,cLabel(h)];
const kOf=p=>JSON.stringify(p);
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

function persist(){} // nothing is ever stored in the browser
function restore(){try{localStorage.removeItem(KEY)}catch(e){}data={headers:[],notes:{},when:{},stubs:[]}}

function buildTrie(){
 const root={kids:new Map()};
 const put=pp=>{let n=root,p=[];for(const part of pp){p=p.concat(part);if(!n.kids.has(part))n.kids.set(part,{label:part,path:p,kids:new Map()});n=n.kids.get(part)}};
 data.stubs.forEach(put);
 for(const h of data.headers){let n=root,p=[];
  for(const part of pathOf(h)){p=p.concat(part);
   if(!n.kids.has(part))n.kids.set(part,{label:part,path:p,kids:new Map()});
   n=n.kids.get(part)}}
 return root}

function renderTree(){
 if(mode==='graph')renderGraph();
 const t=$('#tree');t.innerHTML='';
 const root=buildTrie();
 if(!root.kids.size){t.append(el('div','empty','No headers yet. Add one, or load a saved hierarchy.'));return}
 const q=$('#q').value.trim().toLowerCase();
 const mark=n=>{let any=false;n.kids.forEach(c=>{if(mark(c))any=true});n.self=!!(q&&n.label&&n.label.toLowerCase().includes(q));n.sub=any;return n.self||any};
 mark(root);
 const draw=(node,parent,lv,under)=>{
  [...node.kids.values()].filter(c=>!q||under||c.self||c.sub).sort((a,b)=>sortDir*a.label.localeCompare(b.label,undefined,{numeric:true})).forEach(c=>{
   const k=kOf(c.path),has=c.kids.size>0,wrap=el('div','lv'+lv);
   const row=el('div','row'+(sel&&kOf(sel)===k?' sel':''));
   const car=el('button','car'+(has?'':' leaf'),(open.has(k)||(q&&c.sub))?'▾':'▸');
   car.setAttribute('aria-label','Toggle');
   car.onclick=()=>{open.has(k)?open.delete(k):open.add(k);renderTree()};
   const lab=el('button','lab'+(c.self?' hit':''),c.label);lab.title=LEVELS[lv];
   lab.onclick=()=>{sel=c.path;if(has)open.add(k);renderTree();renderView();$('#side').classList.remove('open')};
   const plus=el('button','plus','+');plus.title='Duplicate '+c.label;plus.setAttribute('aria-label','Duplicate '+c.label);
   plus.onclick=()=>dup(c.path);
   const pen=el('button','pen','✎');pen.title='Edit '+c.label;pen.setAttribute('aria-label','Edit '+c.label);
   pen.onclick=()=>renameNode(c.path);
   row.append(car,lab,pen,plus);wrap.append(row);
   if(has&&(open.has(k)||(q&&c.sub))){const kids=el('div','kids');draw(c,kids,lv+1,under||c.self);wrap.append(kids)}
   parent.append(wrap)})};
 draw(root,t,0,false);if(q&&!t.children.length)t.append(el('div','empty','No titles match "'+$('#q').value.trim()+'".'))}

function renderView(){
 const v=$('#view');v.innerHTML='';
 if(!sel){v.append(el('div','ph','Select any title in the hierarchy to see its chain and sentences.'));return}
 const ch=el('div','chain');ch.append(el('h2',null,'Chain'));
 const cr=el('div','crumbs');
 const start=sel.length>=4?3:0; // chain runs from Header downward once inside a header
 sel.forEach((p,i)=>{
  if(sel.length>=4&&i<3&&false)return;
  if(i>0)cr.append(el('span','sep','>'));
  const c=el('div','crumb');c.append(el('small',null,LEVELS[i]),el('span',null,p));cr.append(c)});
 ch.append(cr);
 const ct=el('div','ctext',fullText(sel));ch.append(ct);
 const act=el('div','chain-act');
 const cp=el('button','btn sm','Copy text');cp.disabled=!body(sel);
 cp.onclick=async()=>{await copyText(body(sel));toast('Copied')};
 const rn=el('button','btn sm','Edit');
 rn.onclick=()=>renameNode(sel);
 const del=el('button','btn sm danger','Delete this branch');
 del.onclick=()=>confirmBox('Delete this branch and every header under it?',()=>{
  const k=sel.length;
  data.headers=data.headers.filter(h=>!pathOf(h).slice(0,k).every((x,i)=>x===sel[i]));
  for(const key of Object.keys(data.notes)){const p=JSON.parse(key);if(p.length>=k&&sel.every((x,i)=>x===p[i]))delete data.notes[key]}
  for(const key of Object.keys(data.when)){const p=JSON.parse(key);if(p.length>=k&&sel.every((x,i)=>x===p[i]))delete data.when[key]}
  data.stubs=data.stubs.filter(sp=>!pre(sp,sel));
  sel=null;persist();renderTree();renderView()});
 act.append(cp,rn,del);ch.append(act);v.append(ch);

 const key=kOf(sel),list=data.notes[key]||[];
 const wh=el('div','when'),whh=el('div','when-h'),wb=el('button','btn sm'),wbody=el('div');
 whh.append(el('h3',null,'When to use'),wb);wh.append(whh,wbody);
 const drawWhen=edit=>{wbody.innerHTML='';
  if(edit){const wt=el('textarea');wt.value=data.when[key]||'';wt.placeholder='Describe when this category should be used…';
   wt.setAttribute('aria-label','When to use');wbody.append(wt);
   wb.textContent='Save';wb.className='btn pri sm';
   wb.onclick=()=>{const t=wt.value.trim();if(t){data.when[key]=t;drawWhen(false)}else{delete data.when[key];wt.value=''}}}
  else{wbody.append(el('div','when-txt',data.when[key]));wb.textContent='Edit';wb.className='btn sm';wb.onclick=()=>drawWhen(true)}};
 drawWhen(!data.when[key]);v.append(wh);
 const n=el('div','notes'),nh=el('div','notes-h');
 nh.append(el('h3',null,'Sentences'));
 const sl=el('button','btn sm','Load list'),ss=el('button','btn sm','Save list');
 sl.onclick=()=>loadNotes();ss.onclick=()=>saveNotes();
 nh.append(sl,ss);n.append(nh);
 const L=el('div');L.id='list';
 if(!list.length)L.append(el('div','empty','No sentences for this chain yet. Write one below.'));
 list.forEach((s,i)=>{
  const row=el('div','note'),b=el('div','body');b.innerHTML=clean(s.html);
  const x=el('button','btn sm x','Remove');
  x.onclick=()=>{list.splice(i,1);if(!list.length)delete data.notes[key];persist();renderView()};
  row.append(b,x);L.append(row)});
 n.append(L);

 const co=el('div','composer'),tl=el('div','tools');
 const mk=(label,cmd,title,style)=>{const b=el('button',null,label);b.title=title;if(style)b.style.cssText=style;
  b.onmousedown=e=>e.preventDefault();b.onclick=()=>document.execCommand(cmd);tl.append(b)};
 mk('B','bold','Bold','font-weight:700');mk('U','underline','Underline','text-decoration:underline');
 mk('• List','insertUnorderedList','Bullet points');mk('1. List','insertOrderedList','Numbered points');
 const lk=el('button',null,'Link');lk.title='Hyperlink';lk.onmousedown=e=>e.preventDefault();
 const url=el('input');url.placeholder='https://…';url.hidden=true;url.setAttribute('aria-label','Link address');
 let saved=null;
 lk.onclick=()=>{const s=getSelection();saved=s.rangeCount?s.getRangeAt(0).cloneRange():null;url.hidden=!url.hidden;if(!url.hidden)url.focus()};
 url.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();
  let u=url.value.trim();if(!u)return;if(!/^(https?:|mailto:)/i.test(u))u='https://'+u;
  ed.focus();const s=getSelection();s.removeAllRanges();if(saved)s.addRange(saved);
  if(s.isCollapsed)document.execCommand('insertHTML',false,`<a href="${u.replace(/"/g,'&quot;')}">${u.replace(/</g,'')}</a>`);
  else document.execCommand('createLink',false,u);
  url.value='';url.hidden=true};

// keep stored/pasted HTML to a small safe set
function clean(html){
 const d=new DOMParser().parseFromString('<div>'+(html||'')+'</div>','text/html').body.firstChild,doc=d.ownerDocument;
 const ok={B:1,STRONG:1,U:1,UL:1,OL:1,LI:1,A:1,BR:1,I:1,EM:1,DIV:1,P:1};
 (function walk(n){[...n.childNodes].forEach(c=>{
  if(c.nodeType===3)return;
  if(c.nodeType!==1||/^(SCRIPT|STYLE|META|HEAD|TITLE|LINK)$/.test(c.tagName)){c.remove();return}
  walk(c);
  const t=c.tagName,st=(c.getAttribute('style')||'').toLowerCase();
  const bold=/font-weight:\s*(bold|[6-9]00)/.test(st),und=/text-decoration[^;]*underline/.test(st),norm=/font-weight:\s*(normal|[1-4]00)/.test(st);
  if(!ok[t]||((t==='B'||t==='STRONG')&&norm)){
   let h=doc.createDocumentFragment();[...c.childNodes].forEach(k=>h.append(k));
   const wrap=tag=>{const e=doc.createElement(tag);e.append(h);h=e};
   if(bold)wrap('b');if(und)wrap('u');if(/^H[1-6]$/.test(t))wrap('div');
   c.replaceWith(h);return}
  [...c.attributes].forEach(a=>{if(!(t==='A'&&a.name==='href'))c.removeAttribute(a.name)});
  if(t==='A'){const h=c.getAttribute('href')||'';if(!/^(https?:|mailto:)/i.test(h))c.removeAttribute('href');c.target='_blank';c.rel='noopener noreferrer'}
 })})(d);
 return d.innerHTML}
// strips bold, underline, italic and lists; keeps links
function plain(html){
 const d=new DOMParser().parseFromString('<div>'+html+'</div>','text/html').body.firstChild;
 (function w(n){[...n.childNodes].forEach(c=>{if(c.nodeType!==1)return;w(c);
  if(/^(B|STRONG|U|I|EM|UL|OL)$/.test(c.tagName))c.replaceWith(...c.childNodes);
  else if(c.tagName==='LI'){const dv=document.createElement('div');dv.append(...c.childNodes);c.replaceWith(dv)}})})(d);
 return d.innerHTML}

 close=modal('Add header',wrap,[cl,ok]);f.scheme.focus()};

$('#expand').onclick=()=>{(function w(n,p){n.kids.forEach(c=>{if(c.kids.size){open.add(kOf(c.path));w(c)}})})(buildTrie());renderTree()};
$('#collapse').onclick=()=>{open.clear();renderTree()};
const GP=20,HEAD=38;let shrink=0,lastRows=0;
const lerp=(a,b,u)=>a+(b-a)*u;
// first 60% of the slider only tightens spacing and box size (text stays the same); the rest scales everything, text included
function dims(t){const u=Math.min(t/0.6,1),v=Math.max((t-0.6)/0.4,0);
 return{GW:Math.round(lerp(190,96,u)),GG:Math.round(lerp(56,22,u)),GR:Math.round(lerp(52,34,u)),GH:Math.round(lerp(40,30,u)),z:lerp(1,0.55,v)}}
function renderGraph(){
 const host=$('#gs'),st=host.scrollTop,sl=host.scrollLeft;host.innerHTML='';
 const {GW,GG,GH,GR,z}=dims(shrink/100);
 const root=buildTrie(),q=$('#q').value.trim().toLowerCase();
 const mark=n=>{let any=false;n.kids.forEach(c=>{if(mark(c))any=true});n.self=!!(q&&n.label&&n.label.toLowerCase().includes(q));n.sub=any;return n.self||any};
 mark(root);
 const vis=(node,under)=>[...node.kids.values()].filter(c=>!q||under||c.self||c.sub).sort((a,b)=>sortDir*a.label.localeCompare(b.label,undefined,{numeric:true}));
 const nodes=[],edges=[];let row=0;
 const lay=(c,lv,under)=>{const u=under||c.self,kids=vis(c,u);let y;
  if(!kids.length){y=row++*GR}
  else{const ys=kids.map(k=>lay(k,lv+1,u));y=(ys[0]+ys[ys.length-1])/2;ys.forEach(cy=>edges.push([lv,y,cy]))}
  nodes.push({c,lv,y});return y};
 vis(root,false).forEach(c=>lay(c,0,false));lastRows=row;
 $('#gsel').textContent=sel?fullText(sel):'Select a box to see its chain';$('#gopen').hidden=!sel;
 if(!nodes.length){host.append(el('div','empty',q?'No titles match "'+$('#q').value.trim()+'".':'No headers yet. Add one in List mode, or load a saved hierarchy.'));return}
 const X=lv=>GP+lv*(GW+GG),W=GP*2+8*GW+7*GG,H=HEAD+GP*2+row*GR,Y=y=>HEAD+GP+y;
 const cv=el('div','gcanvas'),hd=el('div','ghead');cv.style.width=W+'px';cv.style.height=H+'px';cv.style.zoom=z;hd.style.width=W+'px';cv.append(hd);
 LEVELS.forEach((nm,i)=>{const d=el('div',null,nm),cl=el('div','gcol');
  d.style.left=cl.style.left=(X(i)-GG/2)+'px';d.style.width=cl.style.width=(GW+GG)+'px';hd.append(d);cv.append(cl)});
 const NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg'),pa=document.createElementNS(NS,'path');
 svg.setAttribute('class','glines');svg.setAttribute('width',W);svg.setAttribute('height',H);
 let d='';edges.forEach(([lv,py,cy])=>{const x1=X(lv)+GW,x2=X(lv+1),xm=(x1+x2)/2,y1=Y(py)+GH/2,y2=Y(cy)+GH/2;d+=`M${x1} ${y1}H${xm}V${y2}H${x2}`});
 pa.setAttribute('d',d);pa.setAttribute('fill','none');pa.style.stroke='var(--beige2)';pa.setAttribute('stroke-width','1.2');svg.append(pa);cv.append(svg);
 nodes.forEach(({c,lv,y})=>{
  const n=el('div','gn l'+lv+(sel&&kOf(sel)===kOf(c.path)?' sel':'')+(c.self?' hit':''));
  n.style.cssText=`left:${X(lv)}px;top:${Y(y)}px;width:${GW}px;height:${GH}px`;
  n.title=LEVELS[lv]+': '+c.label;n.style.setProperty('--lines',GH>=36?2:1);n.append(el('span',null,c.label));n.tabIndex=0;
  n.onclick=()=>{sel=c.path;renderTree();renderView()};
  n.onkeydown=e=>{if(e.key==='Enter')n.click()};cv.append(n)});
 host.append(cv);host.scrollTop=st;host.scrollLeft=sl}
function setMode(m){mode=m;document.body.classList.toggle('tree-mode',m==='graph');
 $('#mode').textContent=m==='graph'?'List mode':'Tree mode';
 if(m==='graph'){$('#gq').value=$('#q').value;renderGraph()}else{renderTree();renderView()}}
$('#gz').oninput=e=>{shrink=+e.target.value;renderGraph()};
$('#gfit').onclick=()=>{const h=$('#gs'),cw=h.clientWidth,ch=h.clientHeight;let t=1;
 for(let i=0;i<=100;i++){const d=dims(i/100),w=2*GP+8*d.GW+7*d.GG,hh=HEAD+GP*2+lastRows*d.GR;if(w*d.z<=cw&&hh*d.z<=ch){t=i/100;break}}
 shrink=Math.round(t*100);$('#gz').value=shrink;renderGraph()};
$('#mode').onclick=()=>setMode(mode==='graph'?'list':'graph');
$('#gopen').onclick=()=>{if(sel)for(let i=1;i<sel.length;i++)open.add(kOf(sel.slice(0,i)));setMode('list')};
$('#q').oninput=()=>{$('#gq').value=$('#q').value;renderTree()};
$('#gq').oninput=()=>{$('#q').value=$('#gq').value;renderTree()};
const flip=()=>{sortDir*=-1;const t=sortDir>0?'A–Z':'Z–A';$('#sort').textContent=t;$('#gsort').textContent=t;renderTree()};
$('#sort').onclick=flip;$('#gsort').onclick=flip;
$('#menu').onclick=()=>$('#side').classList.toggle('open');

const hh=()=>document.documentElement.style.setProperty('--hh',$('header.top').offsetHeight+'px');hh();addEventListener('resize',hh);
restore();renderTree();renderView();
</script>
</body>
