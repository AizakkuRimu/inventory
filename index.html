<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory</title>
<meta name="theme-color" content="#121110">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23121110%22/%3E%3Crect x=%222%22 y=%222%22 width=%2260%22 height=%2260%22 rx=%2212%22 fill=%22none%22 stroke=%22%23d8ccb2%22 stroke-opacity=%22.35%22 stroke-width=%222%22/%3E%3Cpath d=%22M22 32H30M30 18V46M30 18H38M30 32H38M30 46H38%22 fill=%22none%22 stroke=%22%23a89d86%22 stroke-width=%223%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Crect x=%229%22 y=%2226%22 width=%2213%22 height=%2212%22 rx=%222.5%22 fill=%22%23d8ccb2%22/%3E%3Crect x=%2238%22 y=%2213%22 width=%2217%22 height=%2210%22 rx=%222.5%22 fill=%22%23a89d86%22/%3E%3Crect x=%2238%22 y=%2227%22 width=%2217%22 height=%2210%22 rx=%222.5%22 fill=%22%23efe6d2%22/%3E%3Crect x=%2238%22 y=%2241%22 width=%2217%22 height=%2210%22 rx=%222.5%22 fill=%22%23a89d86%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#121110;--panel:#26241f;--panel2:#2f2c26;--line:#433f36;--beige:#d8ccb2;--beige2:#a89d86;--sand:#efe6d2;
--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--beige);font:15px/1.5 var(--sans);display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--beige);outline-offset:2px}
header.top{flex-wrap:wrap;display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--ink)}
.logo{width:30px;height:30px;flex:none}
.brand{display:flex;align-items:center;gap:10px;font:600 24px var(--serif);color:var(--sand);letter-spacing:.01em;margin-right:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 12px;color:var(--beige)}
.btn:hover{border-color:var(--beige2)}
.btn.pri{background:var(--beige);color:var(--ink);border-color:var(--beige);font-weight:600}
.btn.pri:hover{background:var(--sand)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.danger:hover{border-color:#c4806a;color:#e0a794}
#menu{display:none}
main{flex:1;display:flex;min-height:0}
aside{width:340px;max-width:44%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-h{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.search{padding:8px 16px;border-bottom:1px solid var(--line)}
.search input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:7px 10px;color:var(--beige)}
.row .lab.hit{box-shadow:inset 0 -2px var(--beige2)}
#tree{overflow-y:auto;overflow-x:hidden;min-height:0;padding:8px 6px 24px;flex:1}
.row{display:flex;align-items:flex-start;gap:2px;border-radius:3px;padding:2px 4px}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--beige);color:var(--ink)}
.row .car{width:20px;height:22px;border:0;background:none;color:inherit;opacity:.8;flex:none;padding:0}
.row .car.leaf{visibility:hidden}
.row .lab{flex:1;min-width:0;text-align:left;background:none;border:0;padding:3px 4px;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
.lv0>.row .lab{font:400 16px var(--serif)}
.lv3>.row .lab{font-family:var(--serif);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.row .plus,.row .pen{width:24px;height:22px;flex:none;border:1px solid var(--line);border-radius:3px;background:none;padding:0;line-height:1;opacity:.55;margin-left:2px}
.row .plus:hover,.row .plus:focus-visible,.row .pen:hover,.row .pen:focus-visible{opacity:1;border-color:var(--beige2)}
.row.sel .plus,.row.sel .pen{border-color:var(--ink)}
.grid label{position:relative}
.cb{position:absolute;top:100%;left:0;right:0;margin-top:2px;max-height:168px;overflow-y:auto;background:var(--ink);border:1px solid var(--beige2);border-radius:3px;z-index:6}
.cb.up{top:auto;bottom:100%;margin:0 0 2px}
.cb .opt{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px;color:var(--beige)}
.cb .opt:hover{background:var(--panel2)}
.pick{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:3px;background:var(--ink);margin-top:10px}
.pick .opt{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;color:var(--beige);overflow-wrap:anywhere}
.pick .opt:hover{background:var(--panel2)}
.pick .opt.on{background:var(--beige);color:var(--ink)}
.info{width:30px;height:30px;border-radius:50%;border:1px solid var(--beige2);background:none;color:var(--beige);font:italic 600 17px var(--serif);padding:0;position:relative;flex:none}
.info:hover{background:var(--panel2)}
.info.dirty::after{content:'';position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#e0a794;border:2px solid var(--ink)}
#infop{position:fixed;top:calc(var(--hh,54px) + 6px);right:12px;width:min(360px,calc(100vw - 24px));max-height:calc(100vh - var(--hh,54px) - 24px);overflow:auto;background:var(--panel);border:1px solid var(--beige2);border-radius:4px;padding:16px;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#infop[hidden]{display:none}
#infop h4{margin:16px 0 4px;font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--beige2)}
#infop .big{font:400 18px/1.35 var(--serif);color:var(--sand);overflow-wrap:anywhere}
#infop small{color:var(--beige2);font-size:13px}
#infop .hist{list-style:none;margin:6px 0 0;padding:0;max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:3px;background:var(--ink)}
#infop .hist li{padding:7px 10px;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
#infop .hist li:last-child{border:0}
#infop .hist li small{display:block}
#infop .pstat{margin-top:8px;font-size:14px}
#infop .pstat.warn{color:#e0a794}
#infop .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.cb .none{padding:8px 10px;color:var(--beige2);font-size:13px}
.ctext{margin-top:14px;padding:10px 12px;background:var(--ink);border:1px solid var(--line);border-radius:3px;font:15px/1.5 var(--serif);color:var(--sand);overflow-wrap:anywhere}
.lv1>.row .lab,.lv2>.row .lab{font-family:var(--serif)}
.kids{margin-left:13px;border-left:1px solid var(--line);padding-left:3px}
.empty{color:var(--beige2);padding:16px}
section.view{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
section.view>*{flex:none}
.when{padding:18px 28px 0}
.when h3{margin:0 0 10px;font:600 18px var(--serif);color:var(--sand)}
.when textarea{width:100%;min-height:96px;resize:vertical;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;color:var(--beige);font:16px/1.55 var(--serif)}
.when textarea::placeholder{color:var(--beige2)}
.when-h{display:flex;align-items:center;margin-bottom:10px}
.when .when-h h3{margin:0 auto 0 0}
.when-txt{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font:16px/1.55 var(--serif);overflow-wrap:anywhere}
.chain{padding:22px 28px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.chain h2{margin:0 0 12px;font:400 15px var(--sans);color:var(--beige2)}
.crumbs{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 10px}
.crumb{display:flex;flex-direction:column}
.crumb small{color:var(--beige2);font-size:11.5px;margin-bottom:1px}
.crumb span{font:400 22px/1.2 var(--serif);color:var(--sand)}
.sep{font:400 22px var(--serif);color:var(--beige2);padding-bottom:0}
.chain-act{margin-top:14px;display:flex;gap:8px}
.notes{display:flex;flex-direction:column;padding:18px 28px 28px}
.notes-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.notes-h h3{margin:0 auto 0 0;font:600 18px var(--serif);color:var(--sand)}
#list{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.note{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:16px;line-height:1.55}
.note:last-child{border:0}
.note .body{flex:1;min-width:0;overflow-wrap:anywhere}
.note ul,.note ol,#ed ul,#ed ol{margin:.3em 0;padding-left:1.4em}
.note a,#ed a{color:var(--sand);text-decoration:underline}
.note .x{align-self:flex-start}
.composer{margin-top:12px;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.tools{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-bottom:1px solid var(--line);align-items:center}
.tools button{min-width:34px;height:30px;background:none;border:1px solid transparent;border-radius:3px;color:var(--beige)}
.tools button:hover{border-color:var(--beige2);background:var(--panel2)}
.tools input{background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:4px 8px;width:190px}
#ed{min-height:64px;max-height:160px;overflow:auto;padding:10px 12px;font:16px/1.55 var(--serif);outline:0}
#ed:empty::before{content:attr(data-ph);color:var(--beige2)}
.composer .foot{display:flex;justify-content:flex-end;gap:8px;padding:6px}
.note .na{display:flex;flex-direction:column;gap:6px;align-self:flex-start}
.ph{color:var(--beige2);padding:40px 28px;font:italic 18px var(--serif)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--panel);border:1px solid var(--beige2);border-radius:4px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 12px;font:600 20px var(--serif);color:var(--sand)}
.modal p{margin:0 0 10px;color:var(--beige2);font-size:14px}
.modal textarea{width:100%;height:240px;background:var(--ink);border:1px solid var(--line);border-radius:3px;color:var(--beige);padding:10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.modal .acts{flex-wrap:wrap;display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.grid label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--beige2)}
.grid .full{grid-column:1/-1}
.grid input,.grid select{background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:7px 9px;color:var(--beige);font-size:15px}
.grid .pair{display:flex;gap:8px}.grid .pair>*{flex:1}
.msg{color:#e0a794;font-size:13px;margin-top:8px;min-height:1em}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--beige);color:var(--ink);padding:8px 16px;border-radius:3px;z-index:20;font-weight:500}
#graph{display:none;flex:1;min-width:0;flex-direction:column;min-height:0}
body.tree-mode aside,body.tree-mode section.view{display:none}
body.tree-mode #graph{display:flex}
body.tree-mode #menu{display:none!important}
.gz{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--beige2)}
.gz input{width:120px;accent-color:var(--beige)}
.gbar{flex-wrap:wrap;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.gbar input{width:240px;max-width:40%;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:6px 10px;color:var(--beige)}
.gsel{flex:1;min-width:0;font:14px var(--serif);color:var(--sand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gscroll{flex:1;overflow:auto;min-height:0;background:var(--ink)}
.gcanvas{position:relative}
.ghead{position:sticky;top:0;z-index:3;height:38px;background:var(--panel);border-bottom:1px solid var(--line)}
.ghead div{position:absolute;top:0;height:38px;display:flex;align-items:center;justify-content:center;font:600 14px var(--serif);color:var(--sand);border-left:1px solid var(--line)}
.gcol{position:absolute;top:38px;bottom:0;border-left:1px solid var(--line);background:rgba(255,255,255,.015)}
.glines{position:absolute;left:0;top:0;pointer-events:none}
.gn{position:absolute;box-sizing:border-box;padding:3px 10px;display:flex;align-items:center;justify-content:center;text-align:center;font:13px/1.25 var(--sans);background:var(--panel2);border:1px solid var(--beige2);border-radius:3px;color:var(--beige);cursor:pointer;overflow:hidden}
.gn span{display:-webkit-box;-webkit-line-clamp:var(--lines,2);-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.gn.l3{font:700 13px/1.25 var(--serif);color:var(--sand);background:var(--panel);border-color:var(--beige)}
.gn.l7{background:var(--beige2);color:var(--ink);border-color:var(--beige2);font-weight:600}
.gn.hit{box-shadow:0 2px 0 var(--sand)}
.gn.sel{background:var(--beige);color:var(--ink);border-color:var(--sand);outline:2px solid var(--sand);outline-offset:2px}
#tpl{display:none;flex:1;min-height:0}
body.tpl-mode main{display:none}
body.tpl-mode #tpl{display:flex}
body.tpl-mode .inv-only,body.tpl-mode #menu{display:none!important}
.tabs{display:flex;gap:2px;margin-right:auto;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px}
.tabs button{border:0;background:none;color:var(--beige2);padding:5px 14px;border-radius:3px;font-weight:500}
.tabs button.on{background:var(--beige);color:var(--ink)}
#tplside{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;background:none;color:var(--beige2);padding:6px 8px;font-size:13px}
.seg button.on{background:var(--beige);color:var(--ink);font-weight:600}
.fsec h4{margin:0 0 6px;font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--beige2)}
.flist label{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border-radius:3px;cursor:pointer;font-size:14px;overflow-wrap:anywhere}
.flist label:hover{background:var(--panel2)}
.flist input{accent-color:var(--beige);margin-top:3px}
.flist small{margin-left:auto;color:var(--beige2)}
.flist.hds{max-height:42vh;overflow-y:auto}
.tplmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#tq{flex:1 1 220px;max-width:420px}
#tfbtn{display:none}
.tstat{color:var(--beige2);font-size:13px}
.terr{padding:10px 18px;background:var(--panel2);border-bottom:1px solid var(--line);color:#e0a794;font-size:14px}
.tscroll{flex:1;overflow:auto;padding:18px 24px 40px;background:var(--ink);min-height:0}
.tfile{font:600 21px var(--serif);color:var(--sand);margin:26px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tfile:first-child{margin-top:0}
.tfile small{font:400 13px var(--sans);color:var(--beige2)}
.tc{margin:0 0 16px;max-width:1000px}
.tc-top{margin-bottom:5px}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--beige2);color:var(--beige);border-radius:999px;padding:2px 11px;font-size:12.5px}
.paper{background:transparent;color:var(--sand);border:1px solid var(--line);border-radius:4px;padding:14px 16px;font:16px/1.55 var(--serif);overflow-x:auto}
.paper p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.paper li{white-space:pre-wrap;overflow-wrap:anywhere}
.paper a{color:var(--beige);text-decoration:underline;text-underline-offset:2px}
.paper table{margin:6px 0}
.paper td{overflow-wrap:anywhere}
.paper mark{background:var(--beige);color:var(--ink);border-radius:2px}
.paper .ful{font:12px/1.35 var(--sans);color:var(--beige2);margin-top:2px;overflow-wrap:anywhere}
.paper .pright{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.modal.wide{width:min(780px,100%)}
.lk-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lk-top input[type=search]{flex:1 1 200px;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:7px 10px;color:var(--beige)}
.lk-chk{font-size:13px;color:var(--beige2);display:flex;align-items:center;gap:6px}
.lk-chk input{accent-color:var(--beige)}
.lk-info{margin:10px 0 6px;font-size:13px;color:var(--beige2)}
.lk-list{max-height:52vh;overflow-y:auto;border:1px solid var(--line);border-radius:3px;background:var(--ink)}
.lk-file{position:sticky;top:0;background:var(--panel2);padding:6px 12px;font:600 14px var(--serif);color:var(--sand);border-bottom:1px solid var(--line)}
.lk-row{padding:9px 12px;border-bottom:1px solid var(--line);position:relative;padding-right:46px}
.lk-row a{color:var(--sand);overflow-wrap:anywhere}
.lk-url{font-size:12px;color:var(--beige2);overflow-wrap:anywhere;margin-top:2px}
.lk-n{position:absolute;right:12px;top:10px;font-size:12px;color:var(--beige2)}
@media(max-width:760px){
 #tplside{position:fixed;inset:var(--hh,54px) 0 0 0;width:auto;z-index:5;transform:translateX(-100%);transition:transform .2s}
 #tplside.open{transform:none}
 #tfbtn{display:inline-block}
 .tscroll{padding:14px 12px 30px}
 #menu{display:inline-block}
 aside{position:fixed;inset:var(--hh,54px) 0 0 0;width:auto;max-width:none;z-index:5;transform:translateX(-100%);transition:transform .2s}
 aside.open{transform:none}
 .chain,.notes,.when{padding-left:16px;padding-right:16px}
 .crumb span{font-size:19px}
 .grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<header class="top">
 <button class="btn" id="menu">Tree</button>
 <div class="brand"><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#121110"/><rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#d8ccb2" stroke-opacity=".35" stroke-width="2"/><path d="M22 32H30M30 18V46M30 18H38M30 32H38M30 46H38" fill="none" stroke="#a89d86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="9" y="26" width="13" height="12" rx="2.5" fill="#d8ccb2"/><rect x="38" y="13" width="17" height="10" rx="2.5" fill="#a89d86"/><rect x="38" y="27" width="17" height="10" rx="2.5" fill="#efe6d2"/><rect x="38" y="41" width="17" height="10" rx="2.5" fill="#a89d86"/></svg>Inventory</div>
 <nav class="tabs"><button id="tabInv" class="on">Inventory</button><button id="tabTpl">FAQs</button></nav>
 <button class="info" id="info" aria-label="Last saved and recent changes" title="Last saved and recent changes">i</button>
 <button class="btn inv-only" id="mode">Tree mode</button>
 <button class="btn inv-only" id="hLoad">Load hierarchy</button>
 <button class="btn inv-only" id="hSave">Save hierarchy</button>
 <button class="btn inv-only" id="aLoad">Load all</button>
 <button class="btn pri inv-only" id="aSave">Save all</button>
</header>
<main>
 <aside id="side">
  <div class="side-h">
   <button class="btn pri sm" id="add">Add header</button>
   <button class="btn sm" id="bulk" title="Change every header from one subject to another">Change subjects</button>
   <button class="btn sm" id="expand">Expand all</button>
   <button class="btn sm" id="collapse">Collapse all</button>
   <button class="btn sm" id="sort" title="Change sort order">A–Z</button>
  </div>
  <div class="search"><input id="q" type="search" placeholder="Search the hierarchy" aria-label="Search the hierarchy" autocomplete="off"></div>
  <div id="tree"></div>
 </aside>
 <section class="view" id="view"></section>
 <section id="graph">
  <div class="gbar">
   <input id="gq" type="search" placeholder="Search the tree" aria-label="Search the tree" autocomplete="off">
   <button class="btn sm" id="gsort" title="Change sort order">A–Z</button>
   <label class="gz" title="Squeeze the tree to see more of it">Shrink <input type="range" id="gz" min="0" max="100" value="0" aria-label="Shrink the tree"></label>

function buildTrie(){
 const root={kids:new Map()};
 const put=pp=>{let n=root,p=[];for(const part of pp){p=p.concat(part);if(!n.kids.has(part))n.kids.set(part,{label:part,path:p,kids:new Map()});n=n.kids.get(part)}};
 data.stubs.forEach(put);
 for(const h of data.headers){let n=root,p=[];
  for(const part of pathOf(h)){p=p.concat(part);
   if(!n.kids.has(part))n.kids.set(part,{label:part,path:p,kids:new Map()});
   n=n.kids.get(part)}}
 return root}

function renderTree(){
 if(mode==='graph')renderGraph();
 const t=$('#tree');t.innerHTML='';
 const root=buildTrie();
 if(!root.kids.size){t.append(el('div','empty','No headers yet. Add one, or load a saved hierarchy.'));return}
 const q=$('#q').value.trim().toLowerCase();
 const mark=n=>{let any=false;n.kids.forEach(c=>{if(mark(c))any=true});n.self=!!(q&&n.label&&n.label.toLowerCase().includes(q));n.sub=any;return n.self||any};
 mark(root);
 const draw=(node,parent,lv,under)=>{
  [...node.kids.values()].filter(c=>!q||under||c.self||c.sub).sort((a,b)=>sortDir*a.label.localeCompare(b.label,undefined,{numeric:true})).forEach(c=>{
   const k=kOf(c.path),has=c.kids.size>0,wrap=el('div','lv'+lv);
   const row=el('div','row'+(sel&&kOf(sel)===k?' sel':''));
   const car=el('button','car'+(has?'':' leaf'),(open.has(k)||(q&&c.sub))?'▾':'▸');
   car.setAttribute('aria-label','Toggle');
   car.onclick=()=>{open.has(k)?open.delete(k):open.add(k);renderTree()};
   const lab=el('button','lab'+(c.self?' hit':''),c.label);lab.title=LEVELS[lv];
   lab.onclick=()=>{sel=c.path;if(has)open.add(k);renderTree();renderView();$('#side').classList.remove('open')};
   const plus=el('button','plus','+');plus.title='Duplicate '+c.label;plus.setAttribute('aria-label','Duplicate '+c.label);
   plus.onclick=()=>dup(c.path);
   const pen=el('button','pen','✎');pen.title='Edit '+c.label;pen.setAttribute('aria-label','Edit '+c.label);
   pen.onclick=()=>renameNode(c.path);
   row.append(car,lab,pen,plus);wrap.append(row);
   if(has&&(open.has(k)||(q&&c.sub))){const kids=el('div','kids');draw(c,kids,lv+1,under||c.self);wrap.append(kids)}
   parent.append(wrap)})};
 draw(root,t,0,false);if(q&&!t.children.length)t.append(el('div','empty','No titles match "'+$('#q').value.trim()+'".'))}

function renderView(){

  for(const key of Object.keys(data.when)){const p=JSON.parse(key);if(p.length>=k&&sel.every((x,i)=>x===p[i]))delete data.when[key]}

  const dn=sel[sel.length-1];sel=null;persist('Deleted "'+dn+'" and everything inside');renderTree();renderView()});

 const key=kOf(sel),list=data.notes[key]||[];
 const wh=el('div','when'),whh=el('div','when-h'),wb=el('button','btn sm'),wbody=el('div');

   wb.onclick=()=>{const t=wt.value.trim();if(t){data.when[key]=t;persist('Saved description for "'+sel[sel.length-1]+'"');drawWhen(false)}else{if(data.when[key])persist('Cleared description for "'+sel[sel.length-1]+'"');delete data.when[key];wt.value=''}}}
  else{wbody.append(el('div','when-txt',data.when[key]));wb.textContent='Edit';wb.className='btn sm';wb.onclick=()=>drawWhen(true)}};

 sl.onclick=()=>loadNotes();ss.onclick=()=>saveNotes();
 const ca=el('button','btn sm','Copy all');ca.disabled=!list.length;
 ca.onclick=async()=>{await copyRich(list.map(x=>'<div>'+clean(x.html)+'</div>').join(''));toast('Copied')};
 nh.append(ca,sl,ss);n.append(nh);
 const L=el('div');L.id='list';
 if(!list.length)L.append(el('div','empty','No sentences for this chain yet. Write one below.'));
 list.forEach((s,i)=>{
  const row=el('div','note'),b=el('div','body');b.innerHTML=clean(s.html);
  const x=el('button','btn sm x','Remove');
  x.onclick=()=>{list.splice(i,1);if(!list.length)delete data.notes[key];persist('Removed a sentence from "'+sel[sel.length-1]+'"');renderView()};
  const cpb=el('button','btn sm','Copy');cpb.onclick=async()=>{await copyRich(clean(s.html));toast('Copied')};
  const na=el('div','na');na.append(cpb,x);row.append(b,na);L.append(row)});
 n.append(L);

 const co=el('div','composer'),tl=el('div','tools');
 const mk=(label,cmd,title,style)=>{const b=el('button',null,label);b.title=title;if(style)b.style.cssText=style;
  b.onmousedown=e=>e.preventDefault();b.onclick=()=>document.execCommand(cmd);tl.append(b)};
 mk('B','bold','Bold','font-weight:700');mk('U','underline','Underline','text-decoration:underline');
 mk('• List','insertUnorderedList','Bullet points');mk('1. List','insertOrderedList','Numbered points');
 const lk=el('button',null,'Link');lk.title='Hyperlink';lk.onmousedown=e=>e.preventDefault();

  let u=url.value.trim();if(!u)return;if(!/^(https?:|mailto:)/i.test(u))u='https://'+u;
  ed.focus();const s=getSelection();s.removeAllRanges();if(saved)s.addRange(saved);
  if(s.isCollapsed)document.execCommand('insertHTML',false,`<a href="${u.replace(/"/g,'&quot;')}">${u.replace(/</g,'')}</a>`);
  else document.execCommand('createLink',false,u);

 const clr=el('button',null,'Clear');clr.title='Remove formatting (keeps links)';clr.onmousedown=e=>e.preventDefault();

  if(s.rangeCount&&!s.isCollapsed&&ed.contains(s.anchorNode)){const t=document.createElement('div');t.append(s.getRangeAt(0).cloneContents());document.execCommand('insertHTML',false,plain(t.innerHTML))}
  else ed.innerHTML=plain(ed.innerHTML)};
 tl.append(lk,url,clr);

 ed.addEventListener('paste',e=>{e.preventDefault();const cd=e.clipboardData,h=cd.getData('text/html');
  const out=h?clean(h):cd.getData('text/plain').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
  document.execCommand('insertHTML',false,out)});
 const foot=el('div','foot'),add=el('button','btn pri','Add sentence');
 add.onclick=()=>{const h=tidy(clean(ed.innerHTML));if(!ed.textContent.trim())return;
  (data.notes[key]=data.notes[key]||[]).push({html:h});persist('Added a sentence to "'+sel[sel.length-1]+'"');renderView();
  const l=$('#list');l.scrollTop=l.scrollHeight};
 const sp=el('button','btn','Split into sentences');sp.title='Split everything in the box into separate sentences and add each one';
 sp.onclick=()=>{if(!ed.textContent.trim())return;const parts=splitSentences(ed.innerHTML);if(!parts.length)return;
  const arr=(data.notes[key]=data.notes[key]||[]);parts.forEach(h=>arr.push({html:h}));
  persist(`Split text into ${parts.length} sentence${parts.length===1?'':'s'} under "${sel[sel.length-1]}"`);renderView();
  const l=$('#list');l.scrollTop=l.scrollHeight;toast(parts.length+' sentence'+(parts.length===1?'':'s')+' added')};
 foot.append(sp,add);co.append(tl,ed,foot);n.append(co);v.append(n)}

// keep stored/pasted HTML to a small safe set
function clean(html){
 const d=new DOMParser().parseFromString('<div>'+(html||'')+'</div>','text/html').body.firstChild,doc=d.ownerDocument;
 const ok={B:1,STRONG:1,U:1,UL:1,OL:1,LI:1,A:1,BR:1,I:1,EM:1,DIV:1,P:1};
 (function walk(n){[...n.childNodes].forEach(c=>{
  if(c.nodeType===3)return;
  if(c.nodeType!==1||/^(SCRIPT|STYLE|META|HEAD|TITLE|LINK)$/.test(c.tagName)){c.remove();return}
  walk(c);
  const t=c.tagName,st=(c.getAttribute('style')||'').toLowerCase();
  const bold=/font-weight:\s*(bold|[6-9]00)/.test(st),und=/text-decoration[^;]*underline/.test(st),norm=/font-weight:\s*(normal|[1-4]00)/.test(st);
  if(!ok[t]||((t==='B'||t==='STRONG')&&norm)){
   let h=doc.createDocumentFragment();[...c.childNodes].forEach(k=>h.append(k));
   const wrap=tag=>{const e=doc.createElement(tag);e.append(h);h=e};
   if(bold)wrap('b');if(und)wrap('u');if(/^H[1-6]$/.test(t))wrap('div');
   c.replaceWith(h);return}
  [...c.attributes].forEach(a=>{if(!(t==='A'&&a.name==='href'))c.removeAttribute(a.name)});
  if(t==='A'){const h=c.getAttribute('href')||'';if(!/^(https?:|mailto:)/i.test(h))c.removeAttribute('href');c.target='_blank';c.rel='noopener noreferrer'}
 })})(d);
 return d.innerHTML}
// removes extra spacing: doubles, tabs, non-breaking spaces, and spaces at the edges of words, tags and lines
function tidy(h){return String(h).replace(/&nbsp;|\u00a0/g,' ')
 .replace(/(<(?:b|strong|u|i|em|a)\b[^>]*>)(\s+)/gi,'$2$1').replace(/(\s+)(<\/(?:b|strong|u|i|em|a)>)/gi,'$2$1')
 .replace(/\s+/g,' ').replace(/(<\/?(?:ul|ol|li|div|p|br)\b[^>]*>) /gi,'$1').replace(/ (<\/?(?:ul|ol|li|div|p|br)\b[^>]*>)/gi,'$1').trim()}
const keep=h=>tidy(clean(String(h)));
const ABBR=new Set(['mr','mrs','ms','dr','prof','sr','jr','st','vs','no','e.g','i.e','approx','dept','inc','ltd','co','cf']);
// splits pasted text into sentences: every line or list item, then every . ! ? ending (skips abbreviations like Dr. and e.g.)
function splitSentences(html){
 let h=clean(html).replace(/&nbsp;|\u00a0/g,' ');
 h=h.replace(/<br\s*\/?>|<\/(?:div|p|li|ul|ol)>/gi,'\u0001').replace(/<\/?(?:div|p|li|ul|ol)\b[^>]*>/gi,'');
 const out=[];
 const push=t=>{const c=tidy(clean(t));if(c&&c.replace(/<[^>]*>/g,'').trim())out.push(c)};
 h.split('\u0001').forEach(line=>{
  const re=/([.!?]+["'’”)\]]*(?:<\/[a-z]+>)*)(\s+)/gi;let last=0,m;
  while((m=re.exec(line))){
   const before=line.slice(0,m.index).replace(/<[^>]*>/g,''),w=(/([\w.]+)$/.exec(before)||[])[1]||'';
   if(ABBR.has(w.toLowerCase())||/^[A-Z]$/.test(w)||/^\d+$/.test(before.trim()))continue;
   push(line.slice(last,m.index+m[1].length));last=m.index+m[0].length}
  push(line.slice(last))});
 return out}
async function copyRich(html){
 const d=document.createElement('div');d.innerHTML=html.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(div|p|li)>/gi,'\n');
 const plain=d.textContent.trim();
 try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})])}
 catch(e){const r=document.createElement('div');r.innerHTML=html;r.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(r);
  const g=document.createRange();g.selectNodeContents(r);const sl=getSelection();sl.removeAllRanges();sl.addRange(g);
  let ok=false;try{ok=document.execCommand('copy')}catch(x){}sl.removeAllRanges();r.remove();if(!ok)await copyText(plain)}}
// strips bold, underline, italic and lists; keeps links
function plain(html){
 const d=new DOMParser().parseFromString('<div>'+html+'</div>','text/html').body.firstChild;
 (function w(n){[...n.childNodes].forEach(c=>{if(c.nodeType!==1)return;w(c);
  if(/^(B|STRONG|U|I|EM|UL|OL)$/.test(c.tagName))c.replaceWith(...c.childNodes);
  else if(c.tagName==='LI'){const dv=document.createElement('div');dv.append(...c.childNodes);c.replaceWith(dv)}})})(d);
 return d.innerHTML}

/* modals */
function modal(title,body,acts,cls){

 m.setAttribute('role','dialog');m.append(el('h3',null,title),body);

function saveBox(title,text,extra){

 b.append(el('p',null,'Copy this text and keep it somewhere safe. Paste it into Load to restore.'),ta);

 cp.onclick=async()=>{try{await navigator.clipboard.writeText(text);toast('Copied')}catch(e){ta.select();document.execCommand('copy');toast('Copied')}};

function loadBox(title,hint,apply){
 const b=el('div'),ta=el('textarea'),msg=el('div','msg');
 ta.placeholder='Paste saved JSON here';b.append(el('p',null,hint),ta,msg);
 let close;const ok=el('button','btn pri','Load'),cl=el('button','btn','Cancel');
 cl.onclick=()=>close();

function saveHier(){markSaved('Saved hierarchy',false);saveBox('Save hierarchy',JSON.stringify({headers:data.headers,stubs:data.stubs},null,2))}
$('#hSave').onclick=saveHier;
function parseHeaders(d){
 const arr=Array.isArray(d)?d:d.headers;
 if(!Array.isArray(arr))throw new Error('Expected a "headers" list.');
 const need=['scheme','category','enquiry','header','subject','topic','action','count','type'];
 arr.forEach((h,i)=>need.forEach(f=>{if(h[f]==null)throw new Error(`Header ${i+1} is missing "${f}".`)}));
 return arr.map(h=>({...h,count:Number(h.count)||1,type:h.type==='req'?'req':'enq'}))}
$('#hLoad').onclick=()=>loadBox('Load hierarchy','Pasting replaces the current hierarchy. Sentences stay as they are.',d=>{
 data.headers=parseHeaders(d);data.stubs=Array.isArray(d.stubs)?d.stubs.filter(Array.isArray).map(a=>a.map(String)):[];sel=null;open.clear();persist('Loaded a hierarchy');renderTree();renderView()});
// compact format: one nested tree, with each title's description (w) and sentences (s) stored on its own node
function packAll(){
 const pack=n=>[...n.kids.values()].map(c=>{const o={n:c.label},k=kOf(c.path);
  if(data.when[k])o.w=data.when[k];
  if(data.notes[k]&&data.notes[k].length)o.s=data.notes[k].map(x=>x.html);
  if(c.kids.size)o.c=pack(c);return o});
 return {v:2,t:pack(buildTrie()),m:{s:meta.saved,l:meta.log.slice(0,15)}}}
function unpackAll(d){
 const hs=[],nn={},wn={},st=[];
 const walk=(list,p)=>list.forEach(o=>{
  const q=p.concat(String(o.n)),k=kOf(q);
  if(typeof o.w==='string'&&o.w.trim())wn[k]=o.w;
  if(Array.isArray(o.s)&&o.s.length)nn[k]=o.s.map(h=>({html:keep(h)}));
  if(Array.isArray(o.c)&&o.c.length)walk(o.c,q);
  else if(q.length<8)st.push(q);
  else if(q.length===8){const m=/^(\d+)\w* (enquiry|request)$/.exec(q[7]);
   hs.push({scheme:q[0],category:q[1],enquiry:q[2],header:q[3],subject:q[4],topic:q[5],action:q[6],count:m?+m[1]:1,type:m&&m[2]==='request'?'req':'enq'})}});
 walk(d.t,[]);return {headers:hs,notes:nn,when:wn,stubs:st}}
$('#aSave').onclick=()=>{markSaved('Saved everything',true);
 const dj=el('button','btn','Download date.json');dj.onclick=downloadDate;
 saveBox('Save everything',JSON.stringify(packAll()),[dj])};
$('#aLoad').onclick=()=>loadBox('Load everything','Pasting replaces the whole hierarchy, descriptions and sentences.',d=>{
 let nd;
 if(d&&d.v===2&&Array.isArray(d.t))nd=unpackAll(d);
 else{const hs=parseHeaders(d),nn={},wn={};
  (Array.isArray(d.notes)?d.notes:[]).forEach(n=>{
   if(!Array.isArray(n.chain)||!Array.isArray(n.sentences))return;
   const k=kOf(n.chain.map(String));nn[k]=(nn[k]||[]).concat(n.sentences.map(h=>({html:keep(h)})))});
  (Array.isArray(d.when)?d.when:[]).forEach(w=>{if(Array.isArray(w.chain)&&typeof w.text==='string'&&w.text.trim())wn[kOf(w.chain.map(String))]=w.text});
  nd={headers:hs,notes:nn,when:wn,stubs:[]}}
 data=nd;sel=null;open.clear();persist('Loaded everything from a saved code');
 if(d&&d.m&&typeof d.m==='object'){
